services:
  - type: web
    name: video-downloader-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: FILE_TTL
        value: "600"
      - key: CLEANUP_INTERVAL
        value: "60"
      - key: MAX_CONCURRENT_JOBS
        value: "3"
      - key: MAX_PLAYLIST_ITEMS
        value: "50"
      - key: MAX_FILE_SIZE
        value: "1073741824"
      - key: RATE_LIMIT_MAX
        value: "20"
