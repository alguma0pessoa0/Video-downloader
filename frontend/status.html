<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status do download</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="/">yt-dlp Downloader</a>
      <nav>
        <a href="/">Início</a>
        <a href="/supported-sites">Sites suportados</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    
<section class="card" id="status-card" data-job-id="">
  <h1 id="status-title">Status do download</h1>
  <div class="progress">
    <div class="progress-bar" id="status-bar" style="width:0%"></div>
  </div>
  <p id="status-msg" class="muted">Carregando...</p>

  <div id="status-ready" hidden>
    <p class="ok">Download concluído!</p>
    <p class="muted">O arquivo será removido do servidor em <strong id="countdown">10:00</strong>.</p>
    <div class="row">
      <a id="download-link" class="btn btn-primary" href="">Baixar arquivo</a>
      <a class="btn" href="/">Novo download</a>
    </div>
    <p id="status-files" class="muted"></p>
  </div>

  <div id="status-error" hidden>
    <p class="error" id="status-error-msg"></p>
    <a class="btn" href="/">Tentar novamente</a>
  </div>
</section>

  </main>
  
<script>
  window.JOB_ID = new URLSearchParams(location.search).get("job") || "";
  window.API_BASE = "URL_DO_BACKEND"; /* troque pela URL do seu backend Flask */
</script>
<script src="/static/app.js"></script>
<script src="/static/status.js"></script>

</body>
</html>
